<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>
    <meta name="description" content="A simple, elegant notes application" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════ -->
<!--  AUTH SCREEN                                       -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="auth-screen" class="screen">
    <div class="auth-card">
        <div class="auth-logo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <h1>Notes</h1>
        </div>
        <p class="auth-subtitle" id="auth-subtitle">Sign in to your account</p>

        <form id="auth-form" autocomplete="off">
            <div class="input-group">
                <label for="auth-username">Username</label>
                <input type="text" id="auth-username" placeholder="Enter your username" required />
            </div>
            <div class="input-group">
                <label for="auth-password">Password</label>
                <input type="password" id="auth-password" placeholder="Enter your password" required />
            </div>
            <div id="auth-error" class="error-msg"></div>
            <button type="submit" id="auth-submit-btn" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <p class="auth-toggle">
            <span id="auth-toggle-text">Don't have an account?</span>
            <a href="#" id="auth-toggle-link">Create one</a>
        </p>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  NOTES SCREEN                                      -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="notes-screen" class="screen hidden">
    <!-- Top bar -->
    <header class="topbar">
        <div class="topbar-left">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            <span class="topbar-title">Notes</span>
        </div>
        <div class="topbar-right">
            <span id="topbar-user" class="topbar-user"></span>
            <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
        </div>
    </header>

    <!-- Main content -->
    <main class="main-content">
        <div class="notes-header">
            <h2 id="notes-heading">My Notes</h2>
            <button id="new-note-btn" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                New Note
            </button>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="empty-state hidden">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
            <p>No notes yet. Create your first one!</p>
        </div>

        <!-- Notes grid -->
        <div id="notes-grid" class="notes-grid"></div>
    </main>

    <!-- Note modal -->
    <div id="note-modal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">New Note</h3>
                <button id="modal-close-btn" class="btn-icon" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <form id="note-form">
                <div class="input-group">
                    <label for="note-title-input">Title</label>
                    <input type="text" id="note-title-input" placeholder="Give your note a title…" required />
                </div>
                <div class="input-group">
                    <label for="note-content-input">Content</label>
                    <textarea id="note-content-input" rows="8" placeholder="Write something…"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="modal-cancel-btn" class="btn btn-ghost">Cancel</button>
                    <button type="submit" id="modal-save-btn" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete confirmation modal -->
    <div id="delete-modal" class="modal-overlay hidden">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h3>Delete Note</h3>
                <button id="delete-modal-close-btn" class="btn-icon" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <p class="delete-msg">Are you sure you want to delete this note? This action cannot be undone.</p>
            <div class="modal-actions">
                <button type="button" id="delete-cancel-btn" class="btn btn-ghost">Cancel</button>
                <button type="button" id="delete-confirm-btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let token = localStorage.getItem("token") || null;
let username = localStorage.getItem("username") || null;
let isLoginMode = true;
let editingNoteId = null;
let deletingNoteId = null;

// ═══════════════════════════════════════════════════════
//  ELEMENTS
// ═══════════════════════════════════════════════════════
const authScreen = document.getElementById("auth-screen");
const notesScreen = document.getElementById("notes-screen");
const authForm = document.getElementById("auth-form");
const authError = document.getElementById("auth-error");
const authSubtitle = document.getElementById("auth-subtitle");
const authSubmitBtn = document.getElementById("auth-submit-btn");
const authToggleText = document.getElementById("auth-toggle-text");
const authToggleLink = document.getElementById("auth-toggle-link");
const topbarUser = document.getElementById("topbar-user");
const logoutBtn = document.getElementById("logout-btn");
const newNoteBtn = document.getElementById("new-note-btn");
const notesGrid = document.getElementById("notes-grid");
const emptyState = document.getElementById("empty-state");
const noteModal = document.getElementById("note-modal");
const noteForm = document.getElementById("note-form");
const modalTitle = document.getElementById("modal-title");
const noteTitleInput = document.getElementById("note-title-input");
const noteContentInput = document.getElementById("note-content-input");
const modalCloseBtn = document.getElementById("modal-close-btn");
const modalCancelBtn = document.getElementById("modal-cancel-btn");
const deleteModal = document.getElementById("delete-modal");
const deleteModalCloseBtn = document.getElementById("delete-modal-close-btn");
const deleteCancelBtn = document.getElementById("delete-cancel-btn");
const deleteConfirmBtn = document.getElementById("delete-confirm-btn");

// ═══════════════════════════════════════════════════════
//  API HELPERS
// ═══════════════════════════════════════════════════════
const API = "/api";

async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (token) headers["Authorization"] = `Bearer ${token}`;

    const res = await fetch(`${API}${path}`, { ...options, headers });

    if (res.status === 204) return null;
    if (res.status === 401) { logout(); throw new Error("Session expired"); }

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Something went wrong");
    return data;
}

// ═══════════════════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════════════════
function toggleAuthMode(e) {
    e.preventDefault();
    isLoginMode = !isLoginMode;
    authError.textContent = "";
    if (isLoginMode) {
        authSubtitle.textContent = "Sign in to your account";
        authSubmitBtn.textContent = "Sign In";
        authToggleText.textContent = "Don't have an account?";
        authToggleLink.textContent = "Create one";
    } else {
        authSubtitle.textContent = "Create a new account";
        authSubmitBtn.textContent = "Sign Up";
        authToggleText.textContent = "Already have an account?";
        authToggleLink.textContent = "Sign in";
    }
}

async function handleAuth(e) {
    e.preventDefault();
    const uname = document.getElementById("auth-username").value.trim();
    const pwd = document.getElementById("auth-password").value;
    authError.textContent = "";

    try {
        if (!isLoginMode) {
            await api("/register", { method: "POST", body: JSON.stringify({ username: uname, password: pwd }) });
        }
        const data = await api("/login", { method: "POST", body: JSON.stringify({ username: uname, password: pwd }) });
        token = data.access_token;
        username = uname;
        localStorage.setItem("token", token);
        localStorage.setItem("username", username);
        showNotesScreen();
    } catch (err) {
        authError.textContent = err.message;
    }
}

function logout() {
    token = null;
    username = null;
    localStorage.removeItem("token");
    localStorage.removeItem("username");
    showAuthScreen();
}

function showAuthScreen() {
    authScreen.classList.remove("hidden");
    notesScreen.classList.add("hidden");
    authForm.reset();
    authError.textContent = "";
}

function showNotesScreen() {
    authScreen.classList.add("hidden");
    notesScreen.classList.remove("hidden");
    topbarUser.textContent = username;
    loadNotes();
}

// ═══════════════════════════════════════════════════════
//  NOTES CRUD
// ═══════════════════════════════════════════════════════
async function loadNotes() {
    try {
        const notes = await api("/notes");
        renderNotes(notes);
    } catch (err) {
        console.error(err);
    }
}

function renderNotes(notes) {
    notesGrid.innerHTML = "";
    if (notes.length === 0) {
        emptyState.classList.remove("hidden");
        notesGrid.classList.add("hidden");
        return;
    }
    emptyState.classList.add("hidden");
    notesGrid.classList.remove("hidden");

    notes.forEach((note) => {
        const card = document.createElement("div");
        card.className = "note-card";
        card.innerHTML = `
            <h3 class="note-card-title">${escapeHtml(note.title)}</h3>
            <p class="note-card-content">${escapeHtml(note.content)}</p>
            <div class="note-card-footer">
                <span class="note-card-date">${formatDate(note.updated_at)}</span>
                <div class="note-card-actions">
                    <button class="btn-icon" data-edit="${note.id}" aria-label="Edit note" title="Edit">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="btn-icon btn-icon-danger" data-delete="${note.id}" aria-label="Delete note" title="Delete">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>
        `;
        notesGrid.appendChild(card);
    });

    // Attach listeners
    notesGrid.querySelectorAll("[data-edit]").forEach((btn) =>
        btn.addEventListener("click", () => openEditModal(Number(btn.dataset.edit)))
    );
    notesGrid.querySelectorAll("[data-delete]").forEach((btn) =>
        btn.addEventListener("click", () => openDeleteModal(Number(btn.dataset.delete)))
    );
}

// ── Create / Edit modal ──────────────────────────────
function openCreateModal() {
    editingNoteId = null;
    modalTitle.textContent = "New Note";
    noteForm.reset();
    noteModal.classList.remove("hidden");
    noteTitleInput.focus();
}

async function openEditModal(id) {
    try {
        const note = await api(`/notes/${id}`);
        editingNoteId = id;
        modalTitle.textContent = "Edit Note";
        noteTitleInput.value = note.title;
        noteContentInput.value = note.content;
        noteModal.classList.remove("hidden");
        noteTitleInput.focus();
    } catch (err) {
        console.error(err);
    }
}

function closeNoteModal() {
    noteModal.classList.add("hidden");
    editingNoteId = null;
}

async function handleNoteSave(e) {
    e.preventDefault();
    const title = noteTitleInput.value.trim();
    const content = noteContentInput.value;

    try {
        if (editingNoteId) {
            await api(`/notes/${editingNoteId}`, { method: "PUT", body: JSON.stringify({ title, content }) });
        } else {
            await api("/notes", { method: "POST", body: JSON.stringify({ title, content }) });
        }
        closeNoteModal();
        loadNotes();
    } catch (err) {
        console.error(err);
    }
}

// ── Delete modal ─────────────────────────────────────
function openDeleteModal(id) {
    deletingNoteId = id;
    deleteModal.classList.remove("hidden");
}

function closeDeleteModal() {
    deleteModal.classList.add("hidden");
    deletingNoteId = null;
}

async function confirmDelete() {
    if (!deletingNoteId) return;
    try {
        await api(`/notes/${deletingNoteId}`, { method: "DELETE" });
        closeDeleteModal();
        loadNotes();
    } catch (err) {
        console.error(err);
    }
}

// ═══════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════
function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

// ═══════════════════════════════════════════════════════
//  EVENT LISTENERS
// ═══════════════════════════════════════════════════════
authToggleLink.addEventListener("click", toggleAuthMode);
authForm.addEventListener("submit", handleAuth);
logoutBtn.addEventListener("click", logout);
newNoteBtn.addEventListener("click", openCreateModal);
noteForm.addEventListener("submit", handleNoteSave);
modalCloseBtn.addEventListener("click", closeNoteModal);
modalCancelBtn.addEventListener("click", closeNoteModal);
deleteModalCloseBtn.addEventListener("click", closeDeleteModal);
deleteCancelBtn.addEventListener("click", closeDeleteModal);
deleteConfirmBtn.addEventListener("click", confirmDelete);

// Close modals on overlay click
noteModal.addEventListener("click", (e) => { if (e.target === noteModal) closeNoteModal(); });
deleteModal.addEventListener("click", (e) => { if (e.target === deleteModal) closeDeleteModal(); });

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
if (token && username) {
    showNotesScreen();
} else {
    showAuthScreen();
}
</script>
</body>
</html>
